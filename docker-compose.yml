services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nibolbot-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_PATH=/app/data/nibolbot.db
      - BOT_SERVICE_URL=http://bot:3001
      - PUBLIC_URL=${PUBLIC_URL:-https://nibol.my.id}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-secret}
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-nibol}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-nibolganteng}
    volumes:
      - ./data:/app/data
    networks:
      - default
      - proxy

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: nibolbot-bot
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - API_URL=http://api:3000
      - PUBLIC_URL=${PUBLIC_URL:-https://nibol.my.id:2235}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-secret}
      - SESSION_DIR=/app/data/session
      - CACHE_DIR=/tmp/nibolbot
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./data:/app/data
      - bot-cache:/tmp/nibolbot
    depends_on:
      - api
    networks:
      - default

volumes:
  bot-cache:

networks:
  default:
    name: nibolbot-net
  proxy:
    external: true
